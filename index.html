<!DOCTYPE html>
<html>
  <head>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="index.css">
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>App</title>
  </head>
  <body>
    <canvas id="canvas" width="800" height="600"></canvas>
    <div id="error"></div>
    <button id="toggleDebugging"></button>
    <div class="input__container">
      <label for="fieldOfView">FOV</label>
      <input id="fieldOfView" min="30" max="120" step="15" type="range" value="30" />
    </div>
    <div class="input__container">
      <label for="nearBound">Near</label>
      <input id="nearBound" min="0.1" max="1" step="0.1" type="range" value="0.1" />
    </div>
    <div class="input__container">
      <label for="farBound">Far</label>
      <input id="farBound" min="20" max="50" step="0.1" type="range" value="20" />
    </div>
    <div class="input__container">
        <label for="lightColor">Light Color</label>
        <input id="lightColor" type="color" value="#FFFFFF" />
    </div>
    <span id="HUD" class="output__container"></span>
    <span id="DEBUG"></span>
    <script src="src/main.ts" type="module"></script>
  </body>
</html>
