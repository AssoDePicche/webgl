<!DOCTYPE html>
<html>
  <head>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="index.css">
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>App</title>
  </head>
  <body>
    <canvas id="canvas" width="640" height="480"></canvas>
    <div class="input__container">
      <label for="angleX">X</label>
      <input id="angleX" min="0" max="180" step="1" type="range" value="0" />
    </div>
    <div class="input__container">
      <label for="angleY">Y</label>
      <input id="angleY" min="0" max="180" step="1" type="range" value="0" />
    </div>
    <div class="input__container">
      <label for="angleZ">Z</label>
      <input id="angleZ" min="0" max="180" step="1" type="range" value="0" />
    </div>
    <div class="input__container">
      <label for="fieldOfView">FOV</label>
      <input id="fieldOfView" min="30" max="120" step="15" type="range" vaue="30" />
    </div>
    <script src="initShaders.js"></script>
    <script src="MVnew.js"></script>
    <script src="gl-matrix.js"></script>
    <script type="module" src="index.js"></script>
  </body>
</html>
